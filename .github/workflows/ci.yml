name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Lint SQL (sqlfluff)
        working-directory: dbt
        run: sqlfluff lint models analyses tests

      - name: Run Python tests
        run: pytest -v

  dbt-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/rsa_key.p8
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.12.7 dbt-snowflake==1.12.5

      - name: Write the Snowflake private key
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$PRIVATE_KEY" > rsa_key.p8
          chmod 600 rsa_key.p8

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps

      - name: Build and test (CI schemas, one month)
        working-directory: dbt
        run: dbt build --target ci --full-refresh
